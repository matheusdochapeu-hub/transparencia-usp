name: Atualizar dados mensais

on:
  schedule:
    # Dia 5 de cada mês, 09:00 UTC (06:00 em Brasília).
    # O portal costuma publicar a competência do mês anterior no início do mês.
    - cron: "0 9 5 * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Reextrair todo o histórico (ignora cache)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dados-mensais
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: pip install --quiet xlrd

      - name: Extrair do Portal da Transparência
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then
            python scripts/extract.py --full --with-campus --campus-categories
          else
            python scripts/extract.py --refresh-last 2 --with-campus --campus-categories
          fi

      - name: Cargos em vacância (Anuário Estatístico)
        run: python scripts/extract_vagas.py

      - name: Recortes por campus e unidade
        run: python scripts/extract_scope.py --months 24 --workers 4

      - name: Construir dados do painel
        run: python scripts/build.py

      - name: Verificar resultados
        run: |
          test -f docs/data/index.json || { echo "index.json ausente"; exit 1; }
          python - <<'PY'
          import json, pathlib
          idx = json.loads(pathlib.Path("docs/data/index.json").read_text(encoding="utf-8"))
          n = len(idx["refs"])
          assert n > 0, "sem competências"
          assert len(idx["categories"]) == 11, "categorias incompletas"
          print(f"OK: {n} competências, última {idx['refs'][-1]['label']}")
          PY

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then
            echo "Nenhuma mudança nos dados."
          else
            ULTIMA=$(python -c "import json;print(json.load(open('docs/data/index.json',encoding='utf-8'))['refs'][-1]['id'])")
            git commit -m "dados: atualiza competência ${ULTIMA}"
            git push
          fi
